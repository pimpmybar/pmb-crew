const Q=new URLSearchParams(location.search), evId=Q.get('id'), token=Q.get('t');
async function freshSession(){
  let s=null; try{ s=JSON.parse(localStorage.getItem('pmb_session')||'null'); }catch(e){}
  if(!s) return null;
  if(s.expires_at*1000 - Date.now() > 60000) return s;
  try{
    const r=await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=refresh_token`,{method:'POST',headers:{'apikey':SUPABASE_KEY,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:s.refresh_token})});
    if(!r.ok) return null; s=await r.json(); localStorage.setItem('pmb_session',JSON.stringify(s)); return s;

}

 /* pozycje PMB spoza buildera */
 {name:"Gin & Tonic",aliases:["Gin&Tonic","G&T","Gin and Tonic"],ing:"Gin, tonik, limonka",desc:"Klasyka gatunku — chłodny, wytrawny i niezawodny."},
 {name:"Paloma",ing:"Tequila, różowy grejpfrut, limonka, syrop z agawy, woda gazowana",desc:"Meksykański klasyk — cytrusowy, lekko gorzki i orzeźwiający."},
 {name:"Hurricane",ing:"Rum, ananas, pomarańcza, limonka, marakuja",desc:"Nowoorleański huragan owoców — słodki, tropikalny, niebezpiecznie pyszny."},
 {name:"Passion Cooler",aliases:["Passion Cooler 0%"],mock:true,ing:"Marakuja, limonka, syrop cukrowy, woda gazowana",desc:"Bezalkoholowe orzeźwienie z egzotyczną marakują."},
 {name:"Bellini",ing:"Prosecco, purée brzoskwiniowe",desc:"Wenecki klasyk — delikatny, musujący, brzoskwiniowy."},
];
const norm=s=>String(s).toLowerCase().replace(/[’'`´]/g,"'").replace(/\s+/g,' ').replace(/\s*0\s*%$/,'').trim();
const IDX={}; LIB.forEach(d=>{ const put=k=>{ if(!IDX[k]) IDX[k]=d; }; put(norm(d.name)); (d.aliases||[]).forEach(a=>put(norm(a))); });

/* ===== PARSOWANIE MENU EVENTU ===== */
const SKIP=/^(umowa|welcome|koktajl|menu|alkoholowe|bezalkoholowe|coffee|kubek|lód|lod|batch|piwo|frizzante|\*|serwis|herbat)/i;
function parseMenu(txt){
  const found=[], seen=new Set();
  const add=(d,mock)=>{ const k=norm(d.name); if(seen.has(k))return; seen.add(k); found.push({...d, mock: mock||d.mock||false}); };
  (txt||'').split(/\n+/).forEach(line=>{
    line=line.trim(); if(!line||SKIP.test(line)) return;
    // nazwa = to co przed — / – / "- " / "·"
    let head=line.split(/\s+[—–]\s+|\s+-\s+|\s+·\s+/)[0].trim();
    if(!head||head.length>44) return;
    // "Whisky Sour / Old Fashioned" -> dwa drinki
    head.split(/\s*\/\s*/).forEach(nm=>{
      nm=nm.trim(); if(!nm) return;
      const isMock=/0\s*%/.test(nm)||/bezalk/i.test(line);
      const hit=IDX[norm(nm)];
      if(hit) add(hit, hit.mock||isMock&&false); // przy wersjach alk+0% pokazujemy jedną pozycję
      else if(/^[A-ZĄĆĘŁŃÓŚŹŻ]/.test(nm)&&!/\d/.test(nm)&&nm.length>=4) add({name:nm,ing:'',desc:''});
    });
  });
  return found;
}

/* ===== SZABLON: VINTAGE SPEAKEASY — CZARNO-BIAŁE (MONO) ===== */
const S={bg:'#ffffff',text:'#000000',title:'#000000',ing:'#333333',desc:'#444444',line:'#bbbbbb',accent:'#000000',footer:'#555555',sub:'#666666',
  titleFont:"'Playfair Display', Georgia, serif",bodyFont:'Georgia, serif'};
function cornerSVG(pos){ const t={tl:'top:24px;left:24px;',tr:'top:24px;right:24px;transform:scaleX(-1);',bl:'bottom:24px;left:24px;transform:scaleY(-1);',br:'bottom:24px;right:24px;transform:scale(-1,-1);'}[pos];
  return `<svg class="corner" style="${t}" viewBox="0 0 50 50"><path d="M 0 0 L 50 0 L 50 4 L 4 4 L 4 50 L 0 50 Z" fill="${S.accent}"/><circle cx="10" cy="10" r="3" fill="${S.accent}"/></svg>`; }
function ornament(){ return `<svg width="280" height="22" viewBox="0 0 280 22" style="display:block;margin:6px auto 18px;">
  <line x1="0" y1="11" x2="90" y2="11" stroke="${S.accent}" stroke-width="1"/>
  <polygon points="100,11 110,4 120,11 110,18" fill="none" stroke="${S.accent}" stroke-width="1"/>
  <polygon points="130,11 140,2 150,11 140,20" fill="${S.accent}"/>
  <polygon points="160,11 170,4 180,11 170,18" fill="none" stroke="${S.accent}" stroke-width="1"/>
  <line x1="190" y1="11" x2="280" y2="11" stroke="${S.accent}" stroke-width="1"/></svg>`; }

let DRINKS=[], EV=null;
function render(){
  const items=DRINKS.filter(d=>d.on);
  const n=items.length, dense=n>10;
  const nameSize=dense?'12px':'15.5px', ingSize=dense?'8px':'8.5px', descSize=dense?'9px':'9.5px', itemPad=dense?'6px':'11px', titleSize=dense?'30px':'36px';
  const item=d=>{
    const mock=d.mock?`<span style="display:inline-block;font-size:7.5px;background:#000;color:#fff;padding:1px 5px;border-radius:3px;margin-left:5px;vertical-align:2px;font-style:normal;letter-spacing:.06em;font-weight:600;font-family:Arial,sans-serif;">MOCKTAIL</span>`:'';
    return `<div style="padding:${itemPad} 0;border-bottom:.5px solid ${S.line};">
      <div style="font-size:${nameSize};font-weight:600;text-transform:uppercase;letter-spacing:.08em;font-family:${S.titleFont};color:${S.text};margin-bottom:3px;">${esc(d.name)}${mock}</div>
      ${d.ing?`<div style="font-size:${ingSize};text-transform:uppercase;letter-spacing:.07em;color:${S.ing};font-family:${S.bodyFont};margin-bottom:3px;">${esc(d.ing)}</div>`:''}
      ${d.desc?`<div style="font-size:${descSize};color:${S.desc};font-family:${S.bodyFont};font-style:italic;line-height:1.5;">${esc(d.desc)}</div>`:''}
    </div>`; };
  $('pg').innerHTML=`
    ${cornerSVG('tl')}${cornerSVG('tr')}${cornerSVG('bl')}${cornerSVG('br')}
    <div id="fitZone" style="flex:1;min-height:0;overflow:hidden;position:relative;z-index:2;display:flex;flex-direction:column;justify-content:center;">
      <div id="fitInner" style="width:100%;">
        <div style="display:flex;flex-direction:column;align-items:center;">
          <div style="width:100%;max-width:460px;">
            <div style="text-align:center;">
              <div style="font-size:9px;letter-spacing:.22em;text-transform:uppercase;color:${S.sub};margin-bottom:8px;font-family:${S.bodyFont};">PIMP MY BAR · BAR EVENTS CONSULTING</div>
              <div style="font-size:${titleSize};font-weight:700;letter-spacing:.12em;color:${S.title};line-height:1.1;margin-bottom:2px;font-family:${S.titleFont};text-transform:uppercase;">Menu Koktajli</div>
              ${ornament()}
            </div>
            ${items.map(item).join('')||'<p style="text-align:center;color:#888;font-family:Inter,sans-serif;padding:30px">Zaznacz koktajle na pasku u góry.</p>'}
          </div>
        </div>
      </div>
    </div>
    <div style="text-align:center;border-top:.5px solid ${S.line};padding-top:12px;position:relative;z-index:2;">
      <div style="font-size:8px;letter-spacing:.14em;text-transform:uppercase;color:${S.footer};font-family:${S.bodyFont};">biuro@pimpmybar.pl &nbsp;·&nbsp; +48 513 916 977 &nbsp;·&nbsp; pimpmybar.pl</div>
    </div>`;
  fit();
}
function fit(){ const z=$('fitZone'),i=$('fitInner'); if(!z||!i)return; i.style.transform=''; i.style.transformOrigin='center center';
  const zh=z.clientHeight, ih=i.getBoundingClientRect().height; if(ih>zh+1) i.style.transform='scale('+Math.max(.5,zh/ih).toFixed(4)+')'; }
window.addEventListener('load',fit); if(document.fonts&&document.fonts.ready) document.fonts.ready.then(()=>{fit();setTimeout(fit,300);});
function toggles(){
  $('drinkToggles').innerHTML=DRINKS.map((d,i)=>`<label><input type="checkbox" data-i="${i}" ${d.on?'checked':''}>${esc(d.name)}</label>`).join('');
  $('drinkToggles').querySelectorAll('input').forEach(c=>c.onchange=()=>{ DRINKS[c.dataset.i].on=c.checked; render(); });
}

/* ===== DANE ===== */
(async()=>{
  try{
    let menuTxt='', label='';
    if(token){
      const r=await fetch(`${SUPABASE_URL}/rest/v1/rpc/crew_get`,{method:'POST',headers:{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY,'Content-Type':'application/json'},body:JSON.stringify({p_token:token})});
      const d=await r.json(); if(!d||!d.agenda){ $('loading').textContent='Menu będzie dostępne po akceptacji eventu.'; return; }
      menuTxt=d.agenda.menu||''; label=`${d.event.name} · ${d.event.event_date}`;
    } else if(evId){
      const sess=await freshSession();
      if(!sess){ $('loading').innerHTML='Sesja wygasła albo nie jesteś zalogowany — <a href="panel.html">zaloguj się w panelu</a> i otwórz menu ponownie.'; return; }
      const r=await fetch(`${SUPABASE_URL}/rest/v1/events?id=eq.${evId}&select=name,event_date,menu`,{headers:{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+sess.access_token}});
      const [e]=await r.json(); if(!e){ $('loading').textContent='Nie znaleziono eventu.'; return; }
      menuTxt=e.menu||''; label=`${e.name} · ${e.event_date}`; EV=e;
    } else { $('loading').textContent='Brak parametru — otwórz z panelu lub z linku barmana.'; return; }
    $('evInfo').textContent=label;
    DRINKS=parseMenu(menuTxt).map(d=>({...d,on:true}));
    if(!DRINKS.length){ $('loading').textContent='Nie rozpoznałem koktajli w menu tego eventu — uzupełnij pole Menu w panelu.'; toggles(); return; }
    toggles(); render();
  }catch(err){ $('loading').textContent='Błąd: '+err.message; }
})();
</script>
