<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PMB — Zakupy</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d0d0f;--card:#17171b;--card2:#1f1f25;--line:#2a2a32;--txt:#f2f0ea;--muted:#9a9aa6;--acc:#e8b04b;--ok:#4cc38a;--bad:#e5534b;--r:16px}
html.light{--bg:#f4f2ec;--card:#ffffff;--card2:#edeae1;--line:#dcd8cc;--txt:#1d1c18;--muted:#6d6c64;--acc:#b07a14;--ok:#1e8a5a;--bad:#c23b34}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:Inter,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:600px;margin:0 auto;padding:16px 14px 90px}
.brand{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.logo{font-family:'Bebas Neue',Inter,sans-serif;font-size:28px;letter-spacing:.06em;line-height:1}
.logo span{color:var(--acc)}
h1{font-family:'Bebas Neue',Inter,sans-serif;font-size:30px;letter-spacing:.03em;margin:0 0 2px;line-height:1.05}
.note{color:var(--muted);font-size:13px;line-height:1.45;margin:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.pill{font-size:12px;font-weight:600;padding:5px 10px;border-radius:999px;background:var(--card2);color:var(--muted);letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}
.pill.ok{background:rgba(76,195,138,.15);color:var(--ok)}
.pill.warn{background:rgba(232,176,75,.15);color:var(--acc)}
.bar{height:8px;background:var(--card2);border-radius:99px;overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:var(--ok);width:0;transition:width .3s}
.tools{display:flex;gap:8px;margin:12px 0}
.tools input{flex:1;background:var(--card2);color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:11px 12px;font:inherit;font-size:16px;outline:none}
.tools button,.tbtn{background:var(--card2);color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit;font-size:14px;font-weight:600;cursor:pointer}
.tools button.on{border-color:var(--acc);color:var(--acc)}
h2{font-family:'Bebas Neue',Inter,sans-serif;font-size:20px;letter-spacing:.05em;color:var(--acc);margin:18px 0 6px}
.item{display:flex;align-items:center;gap:12px;padding:12px 10px;border-top:1px solid var(--line);cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent}
.item:first-of-type{border-top:0}
.item .box{width:28px;height:28px;border-radius:8px;border:2px solid var(--muted);flex:none;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;color:#fff}
.item.done .box{background:var(--ok);border-color:var(--ok)}
.item .nm{flex:1;font-size:16px;line-height:1.3}
.item.done .nm{color:var(--muted);text-decoration:line-through}
.item .cm{font-size:12px;color:var(--acc);margin-top:2px;text-decoration:none!important}
.item .who{font-size:11px;color:var(--muted);margin-top:2px}
.item .q{font-family:'Bebas Neue',Inter,sans-serif;font-size:24px;letter-spacing:.02em;color:var(--acc);white-space:nowrap}
.item.done .q{color:var(--muted)}
.item .u{font-size:12px;color:var(--muted);margin-left:3px;font-family:Inter}
.sticky{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));display:flex;gap:10px;align-items:center;justify-content:space-between}
.sticky b{font-family:'Bebas Neue',Inter,sans-serif;font-size:26px;letter-spacing:.03em}
.hidden{display:none!important}
select{background:var(--card2);color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font:inherit;font-size:14px}
.toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:var(--acc);color:#111;padding:10px 16px;border-radius:12px;font-weight:700;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
.toast.on{opacity:1}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand"><div class="logo">PIMP MY BAR <span>ZAKUPY</span></div><div style="display:flex;gap:6px"><button class="tbtn" id="themeBtn" title="jasny / ciemny">◐</button><button class="tbtn" id="refBtn">Odśwież</button></div></div>
  <div id="err" class="card hidden"><b>Brak dostępu</b><p class="note" style="margin-top:6px">Ten link jest nieaktywny. Poproś Tomka o nowy link do zakupów.</p></div>
  <div id="main" class="hidden">
    <div class="card">
      <div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap">
        <div><h1 id="title">Zakupy</h1><p class="note" id="sub"></p></div>
        <select id="weekSel" class="hidden"></select>
      </div>
      <div class="bar"><i id="barFill"></i></div>
      <p class="note" id="prog" style="margin-top:6px"></p>
    </div>
    <div class="tools"><input id="q" placeholder="szukaj…" autocomplete="off"><button id="hideDone">ukryj zebrane</button></div>
    <div id="list"></div>
    <p class="note" id="upd" style="margin-top:14px"></p>
  </div>
</div>
<div class="sticky hidden" id="foot"><div><span class="note">W koszyku</span><br><b id="footN">0/0</b></div><div class="note" id="footLeft"></div></div>
<div class="toast" id="toast"></div>
<script src="pmb-core.js"></script>
<script>
function toast(m){ const t=$('toast'); t.textContent=m; t.classList.add('on'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('on'),1600); }
initTheme('themeBtn');

const P=new URLSearchParams(location.search); const W=P.get('w'); let WEEK=P.get('week')||null;
let D=null, hideDone=localStorage.getItem('pmb_shop_hide')==='1', q='';
let CAT_ORDER=['ALKOHOLE','PIWO I KEGI','NAPOJE','OWOCE','SYROPY I SOK','KAWA','DODATKI','LÓD','SZKŁO','BAR','CHECK LIST']; // awaryjnie; nadpisywane z shop_get().org.cat_order
const catIdx=c=>{ const i=CAT_ORDER.indexOf(c); return i<0?CAT_ORDER.length:i; };

async function load(){
  if(!W){ $('err').classList.remove('hidden'); return; }
  try{ D=await rpc('shop_get',{p_mtoken:W,p_week:WEEK}); }catch(e){ D=null; }
  if(!D){ $('err').classList.remove('hidden'); $('main').classList.add('hidden'); return; }
  $('err').classList.add('hidden'); $('main').classList.remove('hidden'); $('foot').classList.remove('hidden');
  render();
}
function render(){
  const L=D.list; const checks=D.checks||{};
  if(D.org){ if(Array.isArray(D.org.cat_order)&&D.org.cat_order.length) CAT_ORDER=D.org.cat_order; applyBrand(D.org.brand); }
  if(!L){ $('title').textContent='Zakupy'; $('sub').textContent=`Cześć ${D.first_name||''}! Tomek nie opublikował jeszcze listy na ten tydzień.`; $('list').innerHTML=''; $('prog').textContent=''; $('footN').textContent='0/0'; return; }
  WEEK=L.week_key;
  $('title').textContent=`Zakupy ${fmtD(L.week_from)}–${fmtD(L.week_to)}`;
  $('sub').textContent=`Cześć ${D.first_name||''}! Odhaczaj, co już masz w koszyku — Tomek widzi to na bieżąco.`;
  const weeks=D.weeks||[]; const ws=$('weekSel');
  if(weeks.length>1){ ws.classList.remove('hidden'); ws.innerHTML=weeks.map(w=>`<option value="${esc(w.week_key)}" ${w.week_key===L.week_key?'selected':''}>${fmtD(w.week_from)}–${fmtD(w.week_to)}</option>`).join(''); ws.onchange=()=>{ WEEK=ws.value; load(); }; } else ws.classList.add('hidden');
  const items=(L.items||[]).filter(i=>Number(i.qty)>0);
  const done=items.filter(i=>checks[i.key]).length, total=items.length;
  $('barFill').style.width=(total?Math.round(done/total*100):0)+'%';
  $('prog').textContent=total?`${done} z ${total} pozycji w koszyku · zostało ${total-done}`:'Lista jest pusta.';
  $('footN').textContent=`${done}/${total}`; $('footLeft').textContent=total-done>0?`zostało ${total-done}`:'wszystko zebrane 🎉';
  $('hideDone').classList.toggle('on',hideDone);
  const qq=q.trim().toLowerCase();
  const vis=items.filter(i=>(!hideDone||!checks[i.key])&&(!qq||(i.name+' '+(i.comment||'')+' '+i.category).toLowerCase().includes(qq)));
  const cats=[...new Set(vis.map(i=>i.category))].sort((a,b)=>catIdx(a)-catIdx(b)||a.localeCompare(b,'pl'));
  $('list').innerHTML=cats.map(cat=>`<h2>${esc(cat)}</h2><div class="card" style="padding:2px 6px">${vis.filter(i=>i.category===cat).map(i=>{ const c=checks[i.key]; return `
    <div class="item ${c?'done':''}" data-k="${esc(i.key)}">
      <div class="box">${c?'✓':''}</div>
      <div class="nm">${esc(i.name)}${i.extra?' <span class="pill warn" style="font-size:10px;padding:2px 7px">dokupienie</span>':''}${i.comment?`<div class="cm">💬 ${esc(i.comment)}</div>`:''}${c?`<div class="who">✓ ${esc(c.by||'')} · ${new Date(c.at).toLocaleTimeString('pl-PL',{hour:'2-digit',minute:'2-digit'})}</div>`:''}</div>
      <div class="q">${fmtN(i.qty)}<span class="u">${esc(i.unit||'')}</span></div>
    </div>`; }).join('')}</div>`).join('') || `<p class="note" style="margin-top:12px">${hideDone&&total?'Wszystko zebrane — nic nie zostało do zebrania.':'Brak pozycji.'}</p>`;
  $('list').querySelectorAll('.item').forEach(el=>el.onclick=()=>toggle(el.dataset.k));
  $('upd').textContent=L.updated_at?`Lista zaktualizowana przez Tomka: ${new Date(L.updated_at).toLocaleString('pl-PL',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}. Strona odświeża się sama.`:'';
}
async function toggle(key){
  const was=!!(D.checks||{})[key];
  D.checks=D.checks||{}; if(was) delete D.checks[key]; else D.checks[key]={at:new Date().toISOString(),by:D.first_name}; render(); // optymistycznie
  if(navigator.vibrate) navigator.vibrate(10);
  try{ D=await rpc('shop_check',{p_mtoken:W,p_week:WEEK,p_item:key,p_checked:!was}); render(); }
  catch(e){ toast('Nie zapisało się — sprawdź internet'); load(); }
}
$('q').oninput=e=>{ q=e.target.value; render(); };
$('hideDone').onclick=()=>{ hideDone=!hideDone; localStorage.setItem('pmb_shop_hide',hideDone?'1':'0'); render(); };
$('refBtn').onclick=()=>{ load(); toast('Odświeżono'); };
load();
setInterval(()=>{ if(document.visibilityState==='visible') load(); },20000);
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') load(); });
</script>
</body>
</html>
